name: Build and Publish Odysseus (dev)

on:
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch:
    inputs:
      install_local_ai_support:
        description: Include FastEmbed and Real-ESRGAN compatibility
        type: boolean
        required: false
        default: false

      install_model_tooling:
        description: Include Cookbook, SSH, build tools, and Docker CLI
        type: boolean
        required: false
        default: false

      install_optional:
        description: Include optional Python features such as local STT/TTS
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-dev:
    runs-on: ubuntu-latest

    steps:
      # Checkout this workflow repository, containing the test Dockerfile.
      - name: Checkout Docker build repository
        uses: actions/checkout@v5
        with:
          path: builder
          persist-credentials: false

      # Checkout the upstream application into a separate build context.
      - name: Checkout Odysseus dev
        uses: actions/checkout@v5
        with:
          repository: odysseus-dev/odysseus
          ref: dev
          path: source
          persist-credentials: false

      # Replace upstream's Dockerfile with the test version.
      - name: Apply test Dockerfile
        run: |
          cp builder/Dockerfile source/Dockerfile
          cmp builder/Dockerfile source/Dockerfile

      - name: Prepare lowercase Docker tag
        run: |
          IMAGE_PATH="ghcr.io/${{ github.repository }}"
          echo "DOCKER_TAG=${IMAGE_PATH,,}:dev" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./source/Dockerfile
          push: true
          tags: ${{ env.DOCKER_TAG }}
          cache-from: type=gha,scope=dev-local-dockerfile
          cache-to: type=gha,mode=max,scope=dev-local-dockerfile
